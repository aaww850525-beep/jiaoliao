<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f5a1c">
<title>工程叫料小幫手</title>
<style>
:root{--g:#2f5a1c;--g2:#4d7c2a;--gl:#eef6e4;--gb:#cfe3b8;--p:#7c3aed;--p2:#6d28d9;--pl:#f3edff;--bg:#f3f4f8;--card:#fff;--line:#e5e7eb;--tx:#1f2937;--mu:#6b7280;--warn:#d97706;--red:#dc2626}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 12px 120px}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px}
.bar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;text-decoration:none;color:inherit}
.brand b{font-size:17px;display:block;line-height:1.2}.brand small{color:var(--mu);font-size:12px}
.sel{border:1px solid #d1d5db;border-radius:8px;padding:6px 8px;background:#fff;max-width:150px}
.btn{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:6px 10px;font-size:14px;white-space:nowrap}
.btn:hover{background:#f9fafb}
.btn-p{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}.btn-p:hover{background:var(--p2)}
.btn-g{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}.btn-g:hover{background:#244714}
.btn-d{color:var(--red);border-color:#fecaca}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* tabs */
.tabs{display:flex;gap:4px;margin:14px 0 10px;border-bottom:2px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--p);border-bottom-color:var(--p)}
.tab .n[hidden]{display:none}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--p);color:#fff;font-size:12px;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
/* menu */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:11px 12px 11px 38px;background:#fff}
.search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu)}
.chips{padding:2px 0 8px;position:sticky;top:var(--hh,57px);background:var(--bg);z-index:5}
.crow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.clab{flex:none;align-self:center;font-size:12.5px;font-weight:700;color:var(--g);padding:0 4px 0 2px;white-space:nowrap}
.crow.sub .chip{font-size:12.5px;padding:5px 10px;background:#fbfdf8;border-color:var(--gb)}
.crow.sub .chip.on{background:var(--g2);border-color:var(--g2);color:#fff}
.chip{flex:none;border:1px solid #d1d5db;background:#fff;border-radius:18px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.cat-h{display:flex;align-items:baseline;gap:8px;margin:16px 2px 8px}
.cat-h h3{margin:0;font-size:16px;color:var(--g)}.cat-h small{color:var(--mu)}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.item:hover{border-color:var(--gb);background:#fbfdf8}
.item .ico{flex:none;width:40px;height:40px;border-radius:10px;background:var(--gl);display:grid;place-items:center;font-size:20px}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15px}
.item .tx small{color:var(--mu);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pr{flex:none;text-align:right;font-size:13px;color:var(--g2);font-weight:600}
.badge{flex:none;background:var(--p);color:#fff;border-radius:12px;font-size:12px;padding:2px 8px;font-weight:700}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
/* cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(243,244,248,.95) 30%)}
.cartbar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--g);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 6px 20px rgba(47,90,28,.35)}
.cartbar-in .t{flex:1;font-size:14px}.cartbar-in .t b{font-size:16px}
.cartbar-in button{background:#fff;color:var(--g);border:0;border-radius:12px;padding:9px 14px;font-weight:700}
/* sheet */
dialog{border:0;padding:0;border-radius:18px;max-width:640px;width:calc(100% - 20px);max-height:88vh;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(17,24,39,.45)}
.sh-h{padding:16px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.sh-h h2{margin:0 0 4px;font-size:18px}.sh-h small{color:var(--mu)}
.sh-x{position:absolute;right:10px;top:10px;border:0;background:#f3f4f6;width:32px;height:32px;border-radius:50%;font-size:16px}
.sh-b{padding:10px 16px;overflow:auto;max-height:calc(88vh - 170px)}
.sh-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fff;position:sticky;bottom:0}
.vrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.vrow:last-child{border-bottom:0}
.accg{border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:8px 0}.acch{font-weight:700;padding:6px 0}.acch small{color:#6b7280;font-weight:400}
.accq{display:flex;gap:4px}.accq .chip{padding:4px 8px;font-size:12px}
.vrow .sz{flex:1;min-width:0}
.vrow .sz b{font-size:15px}.vrow .sz small{display:block;color:var(--mu);font-size:12px}
.vrow .pp{flex:none;text-align:right;font-size:13px;min-width:74px}
.vrow .pp b{color:var(--g2);font-size:14px}
.vrow.in{background:var(--pl);margin:0 -16px;padding:10px 16px}
.step{flex:none;display:flex;align-items:center;border:1px solid #d1d5db;border-radius:10px;overflow:hidden;background:#fff}
.step button{border:0;background:#f9fafb;width:34px;height:34px;font-size:18px;color:var(--p)}
.step input{width:52px;border:0;text-align:center;height:34px;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.spec-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
/* form */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid .full{grid-column:1/-1}
label.f{display:block;font-size:13px;color:var(--mu)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:1px solid #d1d5db;border-radius:9px;padding:8px 10px;background:#fff;color:var(--tx)}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;color:var(--tx);font-size:14px}
.opts label{display:flex;align-items:center;gap:5px}
.sec{font-weight:700;color:var(--g);margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.sec .sp{flex:1}
.line{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.line:last-child{border-bottom:0}
.line .no{color:var(--mu);font-weight:700;padding-top:2px;text-align:center}
.line .nm b{font-size:14.5px}.line .nm small{display:block;color:var(--mu);font-size:12px}
.line .ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.line .ctl input.pr{width:90px;border:1px solid #d1d5db;border-radius:8px;padding:6px 8px;text-align:right}
.line .ctl input.rm{flex:1;min-width:120px;border:1px solid #d1d5db;border-radius:8px;padding:6px 8px}
.line .sub{font-weight:700;color:var(--g2);text-align:right;min-width:80px;padding-top:2px}
.line .del{border:0;background:none;color:var(--red);font-size:13px;padding:2px 0}
.tot{display:flex;justify-content:flex-end;gap:18px;padding-top:12px;font-size:15px}
.tot b{color:var(--g);font-size:18px}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.hist{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist{flex-wrap:wrap}.hist .tx{flex:1 1 100%;min-width:0}.hist .btn{padding:5px 10px;font-size:13px}.hist .tx small{display:block;color:var(--mu);font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 6px;border:1px solid var(--gb);background:var(--gl);color:var(--g);margin-left:4px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.sum td.s,table.sum th.s{text-align:center;white-space:nowrap;min-width:64px}
table.sum td.nm{min-width:180px}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum th{text-align:left;background:var(--gl);color:var(--g);padding:8px;border-bottom:2px solid var(--gb);white-space:nowrap}
table.sum th:nth-child(n+2),table.sum td.u,table.sum td.q{text-align:center}
table.sum td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.sum td small{display:block;color:var(--mu);font-size:11.5px}
table.sum td.q{font-weight:700;color:var(--p);font-size:16px;white-space:nowrap}
table.sum td.u{white-space:nowrap}
table.sum tr.sg td{background:#fafafa;font-weight:700;color:var(--g);font-size:13px;padding:6px 8px}
.tpanel{background:transparent;padding:2px 0;margin-bottom:12px}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#6b7280;font-size:13px;margin:0 2px 10px;min-height:28px}
.crumb .cpath{display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.crumb .cb{background:none;border:0;color:#4b5563;padding:2px 4px;font-size:13px;border-radius:6px}
.crumb .cb:hover{background:#e5e7eb}.crumb b{color:#1f2937}
.crumb .back{background:var(--g);color:#fff;padding:5px 10px;font-weight:700}
.crumb .ctitle{color:#9ca3af;font-size:12px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;background:var(--tc);border:0;border-radius:14px;color:#fff;min-height:104px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.12);transition:transform .08s,filter .12s;text-align:center}
.tile:hover{filter:brightness(1.1)}.tile:active{transform:scale(.96)}
.tile .ti{font-size:38px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.tile .tl{font-weight:800;font-size:15px;line-height:1.25;word-break:break-word}
.tile .ts{font-size:11px;opacity:.85;line-height:1.2;word-break:break-all}
.tile.sm{min-height:112px}.tile.sm .ti{font-size:30px}.tile.sm .tl{font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.timg{width:58px;height:58px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.timg img{width:100%;height:100%;object-fit:contain}
.tile.sm .timg{width:54px;height:54px}
.tbadge{position:absolute;top:6px;right:6px;background:#fff;color:#7c3aed;font-weight:800;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tempty{grid-column:1/-1;color:#6b7280;text-align:center;padding:18px 0}
@media (min-width:700px){.tgrid{grid-template-columns:repeat(4,1fr)}}
dialog.pvd{width:100vw;height:100vh;max-width:100vw;max-height:100vh;margin:0;border-radius:0;padding:0;background:#525659}
.pvbar{flex-wrap:wrap;position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#323639;color:#fff}
.pvbar .pvt{flex:1;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvbar .btn{background:#4a4f54;border-color:#5f656b;color:#fff}.pvbar .btn-p{background:var(--p);border-color:var(--p)}
.pvbody{height:calc(100vh - 56px);overflow:auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pvwrap{flex:none;box-shadow:0 4px 14px rgba(0,0,0,.45);background:#fff;overflow:hidden}
.pvwrap>.pg{transform-origin:top left}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.note{font-size:12.5px;color:var(--mu);line-height:1.6}
.foot{text-align:center;color:#9ca3af;font-size:12px;margin:20px 0}
@media (max-width:560px){.tab{padding:10px 7px;font-size:14px}.lb{display:none}.bar .btn{padding:6px 9px}.plab{font-size:0}.grid{grid-template-columns:1fr}.brand small{display:none}.tab{padding:10px 10px}}
@media(display-mode:standalone){
.bar{padding-top:calc(8px + env(safe-area-inset-top))}
.wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
}
#appInstall .sh-b p{line-height:1.8;margin:0 0 16px}

/* Mobile application layout inspired by the supplied reference */
:root{--bg:#f4f4fa;--tx:#242538;--mu:#82848f;--line:#e6e6ee;--p:#823ced;--p2:#6d28d9}
html,body{background:var(--bg)}
.bar{position:sticky;top:0;background:#fff;border-bottom:0;padding:12px 14px 0;z-index:25}
.bar-in{max-width:860px;flex-wrap:nowrap;justify-content:space-between;padding:0 2px 12px}
.brand{gap:9px}
.brand b{font-size:17px;line-height:1.3}
.brand small{font-size:10px;line-height:1.3}
.brand>svg{width:38px;height:38px;background:#2f5a1c;border-radius:11px;padding:4px}
.app-tools{position:relative;flex:none}
.app-tools summary{display:grid;place-items:center;width:37px;height:37px;background:#e5f1d0;color:#3d6228;border-radius:50%;cursor:pointer;list-style:none;font-size:19px;letter-spacing:1px;font-weight:700}
.app-tools summary::-webkit-details-marker{display:none}
.app-tools[open] summary{box-shadow:0 0 0 3px #e8ddfb}
.tools-menu{position:absolute;right:0;top:45px;width:180px;padding:7px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #24253826;z-index:45;display:grid;gap:3px}
.tools-menu .btn{text-align:left;border:0;border-radius:7px;font-size:14px;padding:11px;background:#fff}
.tools-menu .btn:hover{background:#f4edff}
.project-context{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:0 0 11px 11px;border-top:1px solid #f2f2f5}
.project-pin{width:30px;height:30px;background:#eff6e6;border-radius:9px;display:grid;place-items:center;color:#467032;flex:none}
.project-pin svg{width:18px;height:18px;fill:currentColor}
.project-copy{display:grid;flex:1;min-width:0}
.project-copy small{font-size:10px;color:#898b93;line-height:1.4}
.project-copy .sel{border:0;border-radius:0;padding:0 20px 0 0;margin:0;background:#fff;max-width:100%;width:100%;font-size:13px;font-weight:700;min-height:23px;color:#32353b}
.wrap{padding-top:16px;padding-bottom:calc(145px + env(safe-area-inset-bottom))}
.menu-title{margin:0 0 16px}
.menu-title small{font-size:10px;color:#848590;letter-spacing:.1em;font-weight:650}
.menu-title h1{font-size:26px;line-height:1.2;margin:3px 0 7px;letter-spacing:.01em}
.menu-title p{font-size:12px;line-height:1.5;margin:0;color:#85858f}
.search{margin-bottom:20px}
.search input{border-color:#e3e3eb;border-radius:12px;padding:13px 12px 13px 38px;font-size:13px;box-shadow:none}
.search input::placeholder{color:#9b9ba4}
.search span{font-size:16px;color:#9494a0}
.crumb{margin:0 0 12px}
.crumb .cb[data-nav="root"]{font-size:16px;font-weight:750;padding-left:0;color:#2d2c3b}
.crumb .back{font-size:12px;padding:5px 9px}
.crumb .ctitle{display:none}
.tgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile,.tile.sm{min-height:116px;padding:14px 7px 12px;gap:9px;box-shadow:none;border:1px solid #ffffff12;border-radius:12px}
.tile:hover{filter:brightness(1.04)}
.tile .tl,.tile.sm .tl{font-size:12px;line-height:1.45;font-weight:750;word-break:normal;overflow-wrap:anywhere;-webkit-line-clamp:3}
.tile .ts{font-size:10px;line-height:1.4}
.timg,.tile.sm .timg{width:47px;height:47px;display:block;border-radius:10px;box-shadow:none;flex:none}
.timg img{display:block;width:100%;height:100%;object-fit:contain}
.tile .ti,.tile.sm .ti{width:47px;height:47px;background:#fff;color:var(--tc);display:grid;place-items:center;font-size:27px;filter:none;border-radius:10px}
.tile .ti svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .ti .custom-pen{font-size:27px;line-height:1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:0;max-width:884px;margin:0 auto;padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:#fffffffa;border:1px solid #e9e6f0;border-bottom:0;border-radius:0;box-shadow:0 -3px 12px #24253805;backdrop-filter:blur(12px)}
.tab{position:relative;flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;padding:3px 5px 6px;font-size:11px;line-height:1.3;border:0;margin:0;color:#8a9390}
.tab-icon{display:grid;place-items:center;width:37px;height:29px;border-radius:16px}

.tab.on{color:#823ced}
.tab.on .tab-icon{background:#f0e8fe}

.tab .n{position:absolute;top:-2px;left:calc(50% + 7px);font-size:10px;line-height:17px;min-width:17px;padding:0 4px;background:#823ced}

.cartbar-in{padding:10px 10px 10px 14px;border-radius:13px;box-shadow:0 5px 15px #2f5a1c22}
.cartbar-in .t{font-size:12px}
.cartbar-in .t b{font-size:15px}
.cartbar-in button{font-size:12px;padding:9px 11px}
.foot{margin-top:24px;font-size:10px;line-height:1.6}
dialog{border-radius:16px}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b993f0;outline-offset:3px}

 .tile .tl,.tile.sm .tl{font-size:15px}
 .timg,.tile.sm .timg,.tile .ti,.tile.sm .ti{width:66px;height:66px}

}

 .tile,.tile.sm{padding:12px 5px;min-height:114px}
 .tile .tl,.tile.sm .tl{font-size:11px}
 .brand small{font-size:9px}
}

<script>
(function(){
  var el=document.getElementById("offState");
  function upd(){if(el)el.textContent=navigator.onLine?"離線版":"離線使用中";}
  window.addEventListener("online",upd);window.addEventListener("offline",upd);upd();
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").then(function(r){
        r.addEventListener("updatefound",function(){var w=r.installing;if(!w)return;w.addEventListener("statechange",function(){
          if(w.state==="installed"&&navigator.serviceWorker.controller){var t=document.getElementById("toast");if(t){t.textContent="叫料單已更新，下次開啟會用新版";t.classList.add("on");setTimeout(function(){t.classList.remove("on")},4000)}}
          if(w.state==="activated"&&!navigator.serviceWorker.controller&&el)el.textContent="離線版（已可離線使用）";
        })});
      }).catch(function(){});
    });
  }
})();
</script>
